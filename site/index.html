<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign‑Up</title>
  <style>
    :root{--primary:#0066cc;--bg:#f5f5f5;--txt:#333}
    body,html{margin:0;padding:0;height:100%;font-family:sans-serif;background:var(--bg);color:var(--txt);}
    .container{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;}
    .card{background:#fff;padding:1.5rem;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);width:90%;max-width:320px;}
    h2{margin:0 0 .5rem;text-align:center;color:var(--primary);}
    .input-group{margin-bottom:1rem;}
    .input-group label{display:block;font-size:.9rem;margin-bottom:.3rem;}
    .input-group input{width:100%;padding:.5rem;border:1px solid #ccc;border-radius:4px;}
    .btn{width:100%;padding:.6rem;background:var(--primary);color:#fff;border:none;border-radius:4px;cursor:pointer;}
    .toggle{margin-top:.8rem;text-align:center;font-size:.9rem;}
    .toggle a{color:var(--primary);cursor:pointer;text-decoration:none;}
    .error{color:#d00;font-size:.85rem;margin-top:.3rem;display:none;}
  </style>
</head>
<body>
<div class="container">
  <div class="card" id="loginCard">
    <h2>Log Masuk</h2>
    <div class="input-group"><label for="loginEmail">E‑mail</label><input type="email" id="loginEmail" placeholder="contoh@domain.com"></div>
    <div class="input-group"><label for="loginPass">Kata Laluan</label><input type="password" id="loginPass" placeholder="******"></div>
    <div class="error" id="loginError"></div>
    <button class="btn" onclick="handleLogin()">Log Masuk</button>
    <div class="toggle">Tiada akaun? <a onclick="showSignUp()">Daftar</a></div>
  </div>
  <div class="card" id="signUpCard" style="display:none;">
    <h2>Daftar Akaun</h2>
    <div class="input-group"><label for="signName">Nama</label><input type="text" id="signName" placeholder="Nama penuh"></div>
    <div class="input-group"><label for="signEmail">E‑mail</label><input type="email" id="signEmail" placeholder="contoh@domain.com"></div>
    <div class="input-group"><label for="signPass">Kata Laluan</label><input type="password" id="signPass" placeholder="******"></div>
    <div class="error" id="signError"></div>
    <button class="btn" onclick="handleSignUp()">Daftar</button>
    <div class="toggle">Sudah ada akaun? <a onclick="showLogin()">Log Masuk</a></div>
  </div>
</div>
<script>
  function showLogin(){document.getElementById('loginCard').style.display='block';document.getElementById('signUpCard').style.display='none';}
  function showSignUp(){document.getElementById('loginCard').style.display='none';document.getElementById('signUpCard').style.display='block';}
  function showError(id,msg){const el=document.getElementById(id);el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',3000);}
  function handleLogin(){
    const email=document.getElementById('loginEmail').value.trim();const pass=document.getElementById('loginPass').value;
    if(!email||!pass){showError('loginError','Sila isi semua medan.');return;}
    // Simulasi login offline
    if(email==='user@example.com' && pass==='123456'){alert('Berjaya log masuk!');}else{showError('loginError','E‑mail atau kata laluan tidak betul.');}
  }
  function handleSignUp(){
    const name=document.getElementById('signName').value.trim();const email=document.getElementById('signEmail').value.trim();const pass=document.getElementById('signPass').value;
    if(!name||!email||!pass){showError('signError','Sila isi semua medan.');return;}
    // Simulasi pendaftaran offline
    alert('Pendaftaran berjaya! Sila log masuk.');showLogin();
  }
</script>
</body>
</html>
